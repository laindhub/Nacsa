name: DuoLink Direct · APK
on:
  push:
    branches: [duolink-audio-build]
    paths:
      - 'duolink-audio/**'
      - '!duolink-audio/dist/**'
      - '.github/workflows/build-duolink-audio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: duolink-audio
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DuoLink-Direct-0.5.0-beta-apk
          path: duolink-audio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK on isolated branch
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DuoLink-Direct-0.5.0-beta.apk
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add duolink-audio/dist/DuoLink-Direct-0.5.0-beta.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish DuoLink Direct APK [skip ci]"
          git push origin HEAD:duolink-audio-build
