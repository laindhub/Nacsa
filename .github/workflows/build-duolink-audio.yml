name: DuoLink Audio · APK
on:
  push:
    branches: [duolink-audio-build]
    paths:
      - 'duolink-audio/**'
      - '.github/workflows/build-duolink-audio.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: duolink-audio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DuoLink-Audio-0.4.1-beta-apk
          path: duolink-audio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
